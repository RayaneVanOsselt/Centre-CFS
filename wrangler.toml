# Cloudflare Workers (plan GRATUIT) : le site statique (dist/) et l'API /api/* dans un seul projet.
# Déploiement : docs/SETUP.md (« npm run deploy » construit le site puis publie le Worker).
# Les SECRETS ne sont jamais écrits ici : « npx wrangler secret put NOM » (liste dans .dev.vars.example).

name = "centre-cfs"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true          # variables du tableau de bord gardées à chaque déploiement (voir plus bas)

# Site statique : servi directement par Cloudflare (requêtes non facturées comme requêtes Worker).
# Seules les adresses /api/* exécutent le code du Worker. _headers et _redirects (générés par site/build.py) s'appliquent.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Toutes les 10 minutes : rejeu de la boîte de secours des demandes et activité Supabase (évite la pause après 7 jours)
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

# (Réglage de premier niveau placé plus haut : keep_vars.)
# Les variables ajoutées dans le tableau de bord (Workers › centre-cfs › Settings › Variables and Secrets) sont gardées
# à chaque déploiement : EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_CLIENT, EMAILJS_TEMPLATE_EQUIPE,
# SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, TURNSTILE_SITE_KEY (et tous les secrets). Ne les écrivez pas ici.
# Réglages PUBLICS par défaut (aucun secret). SITE_URL est remplacé au déploiement (--var, workflow deploy-cloudflare.yml).
[vars]
SITE_URL = "https://centrecfs.be"
EMAILJS_MONTHLY_QUOTA = "200"
TEAM_NOTIFICATION_EMAIL = "info@centrecfs.be"
ONLINE_PAYMENT_ENABLED = "0"
# IA du chatbot : Claude (Anthropic) si le secret ANTHROPIC_API_KEY existe, sinon (ou en cas d'échec) Workers AI gratuit.
# « local » coupe l'IA. Modèles : CHATBOT_MODEL (Claude) et WORKERS_AI_MODEL (Workers AI, plan gratuit, changelog du
# 28/07/2026). Coûts et réglages : docs/README-ASSISTANT.md.
CHATBOT_PROVIDER = "claude"
CHATBOT_MODEL = "claude-opus-5-5"
WORKERS_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
CHATBOT_DAILY_LIMIT = "200"
VAT_RATE = "0.21"

# Couche IA du chatbot (Workers AI, allocation gratuite de 10 000 neurons par jour ; docs/README-ASSISTANT.md).
# Pour la couper : CHATBOT_PROVIDER = "local" ci-dessus (le chatbot répond alors avec son cœur local seul).
[ai]
binding = "AI"
