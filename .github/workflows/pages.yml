# Construit le site (python3 site/build.py) et le publie sur GitHub Pages.
# Prérequis (une seule fois) : Settings › Pages › Build and deployment › Source = « GitHub Actions ».
#
# Déclenchement : chaque envoi sur main, à la demande (onglet Actions › « Run workflow »), et chaque nuit
# pour que les sessions passées disparaissent aussi des données structurées (Google) et du bandeau d'annonce.
name: Publier le site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lire la configuration GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Outils Python (minification CSS)
        run: python3 -m pip install --quiet rcssmin==1.3.0

      - name: Construire le site
        env:
          # Adresse publique et chemin de base, fournis par GitHub :
          # « https://<compte>.github.io/Centre-CFS » et « /Centre-CFS », ou le domaine personnalisé et « ».
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Destinataire des demandes (contact, devis, inscriptions). Pour le changer sans toucher au code :
          # Settings › Secrets and variables › Actions › onglet Variables › FORM_EMAIL.
          FORM_EMAIL: ${{ vars.FORM_EMAIL || 'vanosselt.rayane@gmail.com' }}
          # « Tout chez Google » (DECISIONS.md D-018) : application Web de la feuille « Réservations – Centre CFS ».
          # Formulaires, agenda en direct et réservations sur facture passent directement par la feuille, sans serveur.
          # Adresse publique (toute demande y est revalidée). Pour la changer : variable GitHub GOOGLE_SCRIPT_URL.
          GOOGLE_SCRIPT_URL: ${{ vars.GOOGLE_SCRIPT_URL || 'https://script.google.com/macros/s/AKfycbzEYakTIqFwJAyvYY-aJwYD6CwU9aDZcsdYeuW8JZe5HUS-Vl_g9ij-uBBNeE-SxA46/exec' }}
          # Facultatif : autre adresse qui reçoit les formulaires en JSON (remplace celle de la feuille).
          FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          # Facultatif : liste publique des sessions avec places en direct. Vide = client/sessions.csv.
          SESSIONS_PUBLIC_URL: ${{ vars.SESSIONS_PUBLIC_URL }}
          # Assistant du site (cœur local, sans IA ni serveur sur GitHub Pages). 0 pour le masquer.
          CHATBOT_ENABLED: ${{ vars.CHATBOT_ENABLED || '1' }}
          TZ: Europe/Brussels
        run: python3 site/build.py

      - name: Contrôler les traductions
        run: python3 site/tools/check_i18n.py

      - name: Contrôler les liens
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 site/tools/check_links.py

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
