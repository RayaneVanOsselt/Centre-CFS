# Publie le site ET l'API (formulaires reliés à la feuille, réservations, chatbot avec IA) sur Cloudflare Workers.
# Aucun Node ni terminal nécessaire : onglet Actions › « Publier sur Cloudflare » › Run workflow.
#
# Prérequis (une seule fois, docs/SETUP.md) :
#   Settings › Secrets and variables › Actions › Secrets : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   (facultatif) Variables : SITE_URL (ex. https://centre-cfs.<compte>.workers.dev tant que le domaine n'est pas branché),
#   TURNSTILE_SITE_KEY, ONLINE_PAYMENT_ENABLED, ACCOUNTS_ENABLED, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
# Les secrets du Worker (adresse de la feuille, secret HMAC, clé privée EmailJS…) se rangent dans Cloudflare,
# jamais ici : Workers › centre-cfs › Settings › Variables and Secrets.
name: Publier sur Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TZ: Europe/Brussels
      SITE_URL: ${{ vars.SITE_URL || 'https://centrecfs.be' }}
    steps:
      - uses: actions/checkout@v7

      - name: Outils Python (minification CSS)
        run: python3 -m pip install --quiet rcssmin==1.3.0

      - name: Construire le site en mode Worker (API, chatbot avec IA)
        env:
          BASE_PATH: ""
          WORKER_API: "1"
          CHATBOT_ENABLED: "1"
          CHATBOT_PROVIDER: workers-ai
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          ONLINE_PAYMENT_ENABLED: ${{ vars.ONLINE_PAYMENT_ENABLED || '0' }}
          ACCOUNTS_ENABLED: ${{ vars.ACCOUNTS_ENABLED || '0' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 site/build.py

      - name: Contrôles avant publication
        run: python3 site/tools/check_links.py && python3 site/tools/check_i18n.py

      - name: Publier le Worker et le site
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.158.0"   # même version que package.json
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var SITE_URL:${{ env.SITE_URL }} --var ONLINE_PAYMENT_ENABLED:${{ vars.ONLINE_PAYMENT_ENABLED || '0' }}
