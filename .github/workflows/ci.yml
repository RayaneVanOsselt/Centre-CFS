# Intégration continue : à chaque envoi (toutes les branches) et chaque pull request.
# Rien n'est publié ici (la publication GitHub Pages est dans pages.yml, sur main seulement).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Brussels
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Dépendances Node (outils de test uniquement)
        run: npm ci --no-audit --no-fund

      - name: Outils Python
        run: python3 -m pip install --quiet pytest==8.4.2 rcssmin==1.3.0

      - name: Construire le site (et les données du Worker)
        run: python3 site/build.py

      - name: Syntaxe JavaScript
        run: npm run check:js

      - name: Lint
        run: npx eslint worker tests scripts

      - name: Tests Node (Worker, moteur Google Sheets, Supabase, chatbot)
        run: npm test

      - name: Tests Python
        run: python3 -m pytest site/tests -q

      - name: Traductions, liens et SEO
        run: npm run check

      - name: Construction en mode Worker (domaine, API)
        run: npm run build:worker

      - name: Vulnérabilités des dépendances (production)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Recherche de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
